<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
<!-- HEADER FOR STARTING PART -->
    <header>
        <h1><u>Semantic tags test</u></h1>
        <p>test for sematic tags</p>
    </header>
    <br>
<hr>
 <!-- NAV FOR LINKS -->
  <h2>NAVIGATION</h2>
<nav>  <!-- "a" IS ANCHOR TAG THAT IS USED TO SHIFT THE USER TO ANOTHER PAGE -->
    <a href="#">About</a><br>
    <a href="#">LINK</a>
</nav>
<hr>
<!-- MAIN FOR IMPRORTANT CONTENT -->
 <main>
    <h2>Main Content</h2>
    <p>necesscary content goes here</p>
 </main>
<!--ONLY ONE MAIN TAG  -->
<hr>

<!-- SECTION TAG GIVES RELATED CONTENT -->
 <section>
    <h2>SECTION TAG</h2>
    <p>HTML, CSS, JAVASCRIPT</p>
 </section>
 <hr>

 <!-- ARTICLE TAG  -->
  <article>
    <h3>BLOG title</h3>
    <p>blog ka content </p>
  </article>
<hr>

<!-- ASIDE TAG  -->
<aside>
    <h4>related posts</h4>
    <p>purne blogs</p>
</aside>
<hr>
<!-- FOOTER TAG  -->
<footer>

</footer>
